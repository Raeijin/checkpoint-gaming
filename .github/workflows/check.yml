name: Check static articles
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- articles sitemap.xml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
